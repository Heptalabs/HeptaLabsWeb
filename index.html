<!DOCTYPE html>
<html lang="ko" data-theme="night">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Hepta Labs | Future Infrastructure</title>
    <meta
      name="description"
      content="Hepta Labs company profile with multilingual support, day/night themes, and dynamic business portfolio pages."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;700&family=Sora:wght@400;600;700;800&display=swap"
      rel="stylesheet"
    />
    <link rel="icon" type="image/svg+xml" href="./assets/brand/favicon.svg" />
    <link rel="shortcut icon" href="./assets/brand/favicon.svg" />
    <link rel="stylesheet" href="./styles.css?v=20260504businessMedia4" />
  </head>
  <body data-page="home">
    <div class="page-bg" aria-hidden="true"></div>
    <div class="orb orb-top" data-depth="18" aria-hidden="true"></div>
    <div class="orb orb-bottom" data-depth="24" aria-hidden="true"></div>

    <header class="site-header reveal">
      <a class="brand" href="/main" aria-label="Hepta Labs home">
        <img class="brand-logo brand-logo-day" src="./assets/brand/logo-lr-black.svg" alt="Hepta Labs" />
        <img class="brand-logo brand-logo-night" src="./assets/brand/logo-lr-white.svg" alt="Hepta Labs" />
      </a>

      <nav class="primary-nav" data-primary-nav></nav>

      <div class="header-controls">
        <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle theme"></button>
        <div class="lang-switch" role="group" aria-label="Language switcher">
          <button type="button" data-lang="ko">KO</button>
          <button type="button" data-lang="en">EN</button>
          <button type="button" data-lang="zh">ZH</button>
        </div>
      </div>
    </header>

    <main class="home-main">
      <section class="hero reveal">
        <p class="hero-kicker" data-home-kicker></p>
        <h1 data-home-title></h1>
        <p class="hero-line" data-home-line1></p>
        <p class="hero-line" data-home-line2></p>
        <p class="hero-line" data-home-line3></p>
        <figure class="hero-media" data-home-media-wrap hidden>
          <img data-home-media-img src="" alt="" loading="lazy" />
        </figure>
        <div class="hero-actions">
          <a class="cta primary" data-home-cta-primary href="#footer-panel"></a>
          <a class="cta ghost" data-home-cta-secondary href="/about/hepta-labs"></a>
        </div>
      </section>

      <section class="spotlight-grid reveal" data-home-cards></section>

      <section class="home-pricing reveal" id="pricing">
        <div class="home-pricing-head">
          <h2 class="home-pricing-title" data-home-pricing-title></h2>
          <a class="cta ghost small home-pricing-link" href="/help/contact" data-home-pricing-link></a>
        </div>
        <p class="home-pricing-lead" data-home-pricing-lead></p>
        <div class="home-pricing-grid">
          <article class="home-pricing-card">
            <h3 data-home-pricing-starter-title></h3>
            <p class="home-pricing-price" data-home-pricing-starter-price></p>
            <p class="home-pricing-desc" data-home-pricing-starter-desc></p>
          </article>
          <article class="home-pricing-card featured">
            <h3 data-home-pricing-growth-title></h3>
            <p class="home-pricing-price" data-home-pricing-growth-price></p>
            <p class="home-pricing-desc" data-home-pricing-growth-desc></p>
          </article>
          <article class="home-pricing-card">
            <h3 data-home-pricing-enterprise-title></h3>
            <p class="home-pricing-price" data-home-pricing-enterprise-price></p>
            <p class="home-pricing-desc" data-home-pricing-enterprise-desc></p>
          </article>
        </div>
      </section>

      <footer class="footer-panel footer-panel-home reveal" id="footer-panel">
        <div class="home-footer-top">
          <div class="home-footer-brand">
            <div class="footer-brand-lockup">
              <img class="footer-brand-logo footer-brand-logo-day" src="./assets/brand/logo-ud-white.svg" alt="Hepta Labs" />
              <img class="footer-brand-logo footer-brand-logo-night" src="./assets/brand/logo-ud-black.svg" alt="Hepta Labs" />
            </div>
            <strong data-home-footer-brand-name></strong>
            <p class="muted" data-home-footer-brand-desc></p>
          </div>
          <div class="home-footer-columns">
            <section class="home-footer-col">
              <h4 data-home-footer-col-product></h4>
              <a href="/business/mining" data-home-footer-link-product-1></a>
              <a href="/business/white-label" data-home-footer-link-product-2></a>
              <a href="/business/ai-trading-bot" data-home-footer-link-product-3></a>
            </section>
            <section class="home-footer-col">
              <h4 data-home-footer-col-developers></h4>
              <a href="/infos/news" data-home-footer-link-dev-1></a>
              <a href="/infos/notice" data-home-footer-link-dev-2></a>
              <a href="/download/" data-home-footer-link-dev-3></a>
            </section>
            <section class="home-footer-col">
              <h4 data-home-footer-col-company></h4>
              <a href="/about/hepta-labs" data-home-footer-link-company-1></a>
              <a href="/help/qna" data-home-footer-link-company-2></a>
              <a href="/help/contact" data-home-footer-link-company-3></a>
            </section>
          </div>
        </div>
        <div class="home-footer-newsletter">
          <div>
            <h4 data-home-footer-news-title></h4>
            <p class="muted" data-home-footer-news-desc></p>
          </div>
          <div class="home-footer-subscribe">
            <input type="email" data-home-footer-news-placeholder placeholder="email@company.com" aria-label="newsletter email" />
            <button class="cta ghost small" type="button" data-home-footer-news-cta></button>
          </div>
        </div>
        <div class="home-footer-bottom">
          <span data-footer-copyright></span>
          <span class="home-footer-community" data-footer-community></span>
          <div class="home-footer-bottom-links">
            <a href="/help/qna" data-home-footer-bottom-faq></a>
            <a href="/help/contact" data-home-footer-bottom-status></a>
          </div>
        </div>
      </footer>
    </main>

    <script src="./content.js?v=20260504businessMedia4"></script>
    <script src="./app.js?v=20260504businessMedia4"></script>
  </body>
</html>
