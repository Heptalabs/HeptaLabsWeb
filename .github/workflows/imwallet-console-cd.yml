name: IMWallet Console CD

on:
  push:
    branches:
      - main
      - master
    paths:
      - "imwallet-console/**"
      - "scripts/imwallet-cd/deploy-console-via-jump.sh"
      - ".github/workflows/imwallet-console-cd.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Build + Deploy Console via Jump
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: imwallet-console/package-lock.json

      - name: Install + Build console
        run: |
          cd imwallet-console
          npm ci
          npm run build

      - name: Prepare SSH key
        run: |
          if [ -z "${IMWALLET_JUMP_SSH_PRIVATE_KEY:-}" ]; then
            echo "Missing required secret: IMWALLET_JUMP_SSH_PRIVATE_KEY"
            exit 1
          fi
          printf '%s\n' "$IMWALLET_JUMP_SSH_PRIVATE_KEY" > "$RUNNER_TEMP/imwallet_jump_key"
          chmod 600 "$RUNNER_TEMP/imwallet_jump_key"
        env:
          IMWALLET_JUMP_SSH_PRIVATE_KEY: ${{ secrets.IMWALLET_JUMP_SSH_PRIVATE_KEY }}

      - name: Deploy console
        run: bash scripts/imwallet-cd/deploy-console-via-jump.sh
        env:
          SSH_KEY_PATH: ${{ runner.temp }}/imwallet_jump_key
          IMWALLET_JUMP_HOST: ${{ vars.IMWALLET_JUMP_HOST }}
          IMWALLET_JUMP_PORT: ${{ vars.IMWALLET_JUMP_PORT || '2222' }}
          IMWALLET_JUMP_USER: ${{ vars.IMWALLET_JUMP_USER || 'vm' }}
          IMWALLET_APP_HOST: ${{ vars.IMWALLET_APP_HOST || '192.168.1.167' }}
          IMWALLET_APP_USER: ${{ vars.IMWALLET_APP_USER || 'vm' }}
          IMWALLET_CONSOLE_TARGET_PATH: ${{ vars.IMWALLET_CONSOLE_TARGET_PATH || '/opt/imwallet/console-dist' }}
          IMWALLET_CONSOLE_RESTART_SERVICE: ${{ vars.IMWALLET_CONSOLE_RESTART_SERVICE }}
