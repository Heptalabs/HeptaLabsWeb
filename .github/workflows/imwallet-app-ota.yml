name: IMWallet App OTA

on:
  push:
    branches:
      - main
      - master
    paths:
      - "imwallet-app/**"
      - ".github/workflows/imwallet-app-ota.yml"
  workflow_dispatch:

jobs:
  ota:
    name: Publish OTA Update (Expo)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: imwallet-app
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: imwallet-app/package-lock.json

      - name: Validate Expo token
        run: |
          if [ -z "${EXPO_TOKEN:-}" ]; then
            echo "Missing required secret: EXPO_TOKEN"
            exit 1
          fi
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Install EAS CLI
        run: npm install -g eas-cli

      - name: Publish OTA update
        run: |
          eas update \
            --non-interactive \
            --branch "${EAS_UPDATE_BRANCH}" \
            --message "github:${GITHUB_SHA}"
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EAS_UPDATE_BRANCH: ${{ vars.EAS_UPDATE_BRANCH || 'production' }}
