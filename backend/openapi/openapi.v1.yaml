openapi: 3.0.3
info:
  title: HeptaLabs WebApp API
  version: 1.0.0
  description: |
    Implementation-ready API spec aligned with PRODUCT_PRD_V2.
    Scope: Client Web + Admin Web + Android sideload APK backend.
servers:
  - url: http://localhost:4000/api/v1
    description: Local

tags:
  - name: Health
  - name: Auth
  - name: Member
  - name: Deposit
  - name: Withdrawal
  - name: Product
  - name: Admin

paths:
  /health:
    get:
      tags: [Health]
      summary: Health check
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResponse'

  /auth/signup:
    post:
      tags: [Auth]
      summary: Create member account
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SignupRequest'
      responses:
        '201':
          description: Member created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '409':
          description: Duplicate login_id/email

  /auth/login:
    post:
      tags: [Auth]
      summary: Login with login_id and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Login success
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '401':
          description: Invalid credentials

  /me:
    get:
      tags: [Member]
      security:
        - bearerAuth: []
      summary: Get current member profile + balances
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'
        '401':
          description: Unauthorized

  /me/profile:
    patch:
      tags: [Member]
      security:
        - bearerAuth: []
      summary: Update profile fields allowed for member
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateProfileRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MeResponse'

  /deposits:
    post:
      tags: [Deposit]
      security:
        - bearerAuth: []
      summary: Submit deposit request
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateDepositRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponse'
    get:
      tags: [Deposit]
      security:
        - bearerAuth: []
      summary: Get my deposit requests
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/DepositResponse'

  /withdrawals:
    post:
      tags: [Withdrawal]
      security:
        - bearerAuth: []
      summary: Submit withdrawal request (locks available balance)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateWithdrawalRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'
        '400':
          description: Validation or balance rule violation
    get:
      tags: [Withdrawal]
      security:
        - bearerAuth: []
      summary: Get my withdrawal requests
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WithdrawalResponse'

  /products:
    get:
      tags: [Product]
      security:
        - bearerAuth: []
      summary: Get visible products
      responses:
        '200':
          description: Product list
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/ProductResponse'

  /products/{productId}/subscriptions:
    post:
      tags: [Product]
      security:
        - bearerAuth: []
      summary: Participate in product (moves available -> product_principal)
      parameters:
        - in: path
          name: productId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubscriptionRequest'
      responses:
        '201':
          description: Subscription created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubscriptionResponse'

  /subscriptions:
    get:
      tags: [Product]
      security:
        - bearerAuth: []
      summary: Get my subscriptions
      responses:
        '200':
          description: List
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/SubscriptionResponse'

  /admin/deposits/{depositId}/decision:
    post:
      tags: [Admin]
      security:
        - bearerAuth: []
      summary: Approve or reject deposit request
      parameters:
        - in: path
          name: depositId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [APPROVED, REJECTED]
                adminMemo:
                  type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DepositResponse'

  /admin/withdrawals/{withdrawalId}/decision:
    post:
      tags: [Admin]
      security:
        - bearerAuth: []
      summary: Complete/fail/cancel withdrawal request
      parameters:
        - in: path
          name: withdrawalId
          required: true
          schema:
            type: integer
            format: int64
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [COMPLETED, FAILED, CANCELED]
                chainTxid:
                  type: string
                adminMemo:
                  type: string
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WithdrawalResponse'

  /admin/batch/run:
    post:
      tags: [Admin]
      security:
        - bearerAuth: []
      summary: Run daily settlement batch manually
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                businessDate:
                  type: string
                  format: date
      responses:
        '200':
          description: Batch result
          content:
            application/json:
              schema:
                type: object
                properties:
                  result:
                    type: object

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    HealthResponse:
      type: object
      properties:
        ok:
          type: boolean
        timestamp:
          type: string
          format: date-time

    AuthUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uid:
          type: integer
          format: int64
        loginId:
          type: string
        role:
          type: string
          enum: [MEMBER, ADMIN, SUPER_ADMIN]

    AuthResponse:
      type: object
      properties:
        token:
          type: string
        user:
          $ref: '#/components/schemas/AuthUser'

    SignupRequest:
      type: object
      required:
        - loginId
        - password
        - name
        - phone
        - email
      properties:
        loginId:
          type: string
          pattern: '^[A-Za-z0-9]{4,30}$'
        password:
          type: string
          minLength: 8
          maxLength: 16
        name:
          type: string
        phone:
          type: string
        email:
          type: string
          format: email
        referrerUid:
          type: integer
          format: int64
        usdtAddress:
          type: string

    LoginRequest:
      type: object
      required: [loginId, password]
      properties:
        loginId:
          type: string
        password:
          type: string

    Balance:
      type: object
      properties:
        available:
          type: string
          example: '100.000000'
        withdrawLocked:
          type: string
          example: '10.000000'
        productPrincipal:
          type: string
          example: '50.000000'
        total:
          type: string
          example: '160.000000'

    MeResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        uid:
          type: integer
          format: int64
        loginId:
          type: string
        name:
          type: string
        phone:
          type: string
        email:
          type: string
        level:
          type: integer
        usdtAddress:
          type: string
          nullable: true
        balances:
          $ref: '#/components/schemas/Balance'

    UpdateProfileRequest:
      type: object
      properties:
        phone:
          type: string
        usdtAddress:
          type: string

    CreateDepositRequest:
      type: object
      required: [network, amount, txid]
      properties:
        network:
          type: string
          enum: [TRC20, ERC20, BEP20, OTHER]
        amount:
          type: string
          example: '100.000000'
        txid:
          type: string
        proofNote:
          type: string

    DepositResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        network:
          type: string
        requestedAmount:
          type: string
        txid:
          type: string
        status:
          type: string
        requestedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true

    CreateWithdrawalRequest:
      type: object
      required: [network, amount, destinationAddress]
      properties:
        network:
          type: string
          enum: [TRC20, ERC20, BEP20, OTHER]
        amount:
          type: string
          example: '50.000000'
        destinationAddress:
          type: string

    WithdrawalResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        network:
          type: string
        requestedAmount:
          type: string
        destinationAddress:
          type: string
        status:
          type: string
        requestedAt:
          type: string
          format: date-time
        reviewedAt:
          type: string
          format: date-time
          nullable: true

    ProductResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        guideText:
          type: string
        dailyRate:
          type: string
        profitOccurrenceLimit:
          type: integer
        profitWeekdays:
          type: array
          items:
            type: integer
        returnPrincipal:
          type: boolean

    CreateSubscriptionRequest:
      type: object
      required: [amount]
      properties:
        amount:
          type: string
          example: '100.000000'
        idempotencyKey:
          type: string

    SubscriptionResponse:
      type: object
      properties:
        id:
          type: integer
          format: int64
        productId:
          type: integer
          format: int64
        participationAmount:
          type: string
        status:
          type: string
        joinedAt:
          type: string
          format: date-time
        remainingProfitCount:
          type: integer
        completedProfitCount:
          type: integer
