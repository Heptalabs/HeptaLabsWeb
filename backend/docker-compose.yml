services:
  postgres:
    image: postgres:16-alpine
    container_name: heptalabs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: heptalabs
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d heptalabs"]
      interval: 5s
      timeout: 5s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: heptalabs-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/heptalabs
      JWT_SECRET: ${JWT_SECRET:-dev-only-change-me}
      JWT_EXPIRES_IN: 7d
      DB_BOOTSTRAP_MAX_RETRIES: 40
      DB_BOOTSTRAP_RETRY_INTERVAL_SECONDS: 2
    ports:
      - "4000:4000"
    command: ["./scripts/bootstrap-and-start.sh"]

volumes:
  postgres_data:
