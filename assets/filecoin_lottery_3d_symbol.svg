<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1600" role="img" aria-label="3D Filecoin lottery style symbol">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#17336f"/>
      <stop offset="45%" stop-color="#0f2250"/>
      <stop offset="100%" stop-color="#080f26"/>
    </radialGradient>

    <radialGradient id="haloGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#8ef6ff" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#39b7ff" stop-opacity="0.24"/>
      <stop offset="100%" stop-color="#1f4b9f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f0fbff"/>
      <stop offset="20%" stop-color="#bde9ff"/>
      <stop offset="50%" stop-color="#57c8ff"/>
      <stop offset="80%" stop-color="#0f8fe7"/>
      <stop offset="100%" stop-color="#0561b5"/>
    </linearGradient>

    <radialGradient id="coinFaceGrad" cx="38%" cy="28%" r="75%">
      <stop offset="0%" stop-color="#2bc0ff"/>
      <stop offset="48%" stop-color="#0b8de9"/>
      <stop offset="100%" stop-color="#0053a7"/>
    </radialGradient>

    <linearGradient id="symbolShade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#d8ecff"/>
    </linearGradient>

    <radialGradient id="bulbGold" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fffbe8"/>
      <stop offset="45%" stop-color="#ffd86e"/>
      <stop offset="100%" stop-color="#ff9f2f"/>
    </radialGradient>

    <radialGradient id="bulbPink" cx="35%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#fff0fa"/>
      <stop offset="45%" stop-color="#ff98d6"/>
      <stop offset="100%" stop-color="#f350b0"/>
    </radialGradient>

    <radialGradient id="ballBlue" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#d9f4ff"/>
      <stop offset="45%" stop-color="#8ad2ff"/>
      <stop offset="100%" stop-color="#2e79ff"/>
    </radialGradient>

    <radialGradient id="ballOrange" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#fff4da"/>
      <stop offset="45%" stop-color="#ffc26a"/>
      <stop offset="100%" stop-color="#f27720"/>
    </radialGradient>

    <radialGradient id="ballPurple" cx="30%" cy="25%" r="80%">
      <stop offset="0%" stop-color="#f4ebff"/>
      <stop offset="45%" stop-color="#c39bff"/>
      <stop offset="100%" stop-color="#7a4ee6"/>
    </radialGradient>

    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="coinShadow" x="-50%" y="-50%" width="220%" height="220%">
      <feDropShadow dx="0" dy="28" stdDeviation="26" flood-color="#020712" flood-opacity="0.65"/>
    </filter>

    <filter id="sparkle" x="-150%" y="-150%" width="400%" height="400%">
      <feGaussianBlur stdDeviation="2.6"/>
    </filter>
  </defs>

  <rect width="1600" height="1600" fill="url(#bgGrad)"/>

  <g opacity="0.85">
    <circle cx="220" cy="300" r="6" fill="#76e6ff" filter="url(#sparkle)"/>
    <circle cx="1370" cy="260" r="7" fill="#ffd06f" filter="url(#sparkle)"/>
    <circle cx="290" cy="1320" r="8" fill="#ffa0d9" filter="url(#sparkle)"/>
    <circle cx="1300" cy="1260" r="6" fill="#9ec4ff" filter="url(#sparkle)"/>
    <path d="M280 470 C330 430, 375 445, 410 390" fill="none" stroke="#7df3ff" stroke-width="9" stroke-linecap="round"/>
    <path d="M1230 470 C1185 430, 1130 450, 1095 390" fill="none" stroke="#ffd180" stroke-width="9" stroke-linecap="round"/>
    <path d="M290 1120 C345 1150, 390 1110, 438 1145" fill="none" stroke="#ff9ac9" stroke-width="9" stroke-linecap="round"/>
    <path d="M1310 1110 C1260 1140, 1210 1100, 1160 1138" fill="none" stroke="#8cb8ff" stroke-width="9" stroke-linecap="round"/>
  </g>

  <g transform="translate(800 800)">
    <circle r="650" fill="url(#haloGrad)" opacity="0.9"/>

    <circle r="545" fill="none" stroke="#0a1d44" stroke-width="130" opacity="0.95"/>
    <circle r="545" fill="none" stroke="url(#rimGrad)" stroke-width="24" opacity="0.85"/>

    <g id="bulbA">
      <circle cx="0" cy="-545" r="20" fill="url(#bulbGold)" filter="url(#softGlow)"/>
      <circle cx="-5" cy="-552" r="6" fill="#fff8de" opacity="0.85"/>
    </g>

    <g id="bulbB">
      <circle cx="0" cy="-545" r="20" fill="url(#bulbPink)" filter="url(#softGlow)"/>
      <circle cx="-5" cy="-552" r="6" fill="#ffe7f7" opacity="0.85"/>
    </g>

    <g opacity="0.98">
      <use href="#bulbA" transform="rotate(0)"/>
      <use href="#bulbB" transform="rotate(12)"/>
      <use href="#bulbA" transform="rotate(24)"/>
      <use href="#bulbB" transform="rotate(36)"/>
      <use href="#bulbA" transform="rotate(48)"/>
      <use href="#bulbB" transform="rotate(60)"/>
      <use href="#bulbA" transform="rotate(72)"/>
      <use href="#bulbB" transform="rotate(84)"/>
      <use href="#bulbA" transform="rotate(96)"/>
      <use href="#bulbB" transform="rotate(108)"/>
      <use href="#bulbA" transform="rotate(120)"/>
      <use href="#bulbB" transform="rotate(132)"/>
      <use href="#bulbA" transform="rotate(144)"/>
      <use href="#bulbB" transform="rotate(156)"/>
      <use href="#bulbA" transform="rotate(168)"/>
      <use href="#bulbB" transform="rotate(180)"/>
      <use href="#bulbA" transform="rotate(192)"/>
      <use href="#bulbB" transform="rotate(204)"/>
      <use href="#bulbA" transform="rotate(216)"/>
      <use href="#bulbB" transform="rotate(228)"/>
      <use href="#bulbA" transform="rotate(240)"/>
      <use href="#bulbB" transform="rotate(252)"/>
      <use href="#bulbA" transform="rotate(264)"/>
      <use href="#bulbB" transform="rotate(276)"/>
      <use href="#bulbA" transform="rotate(288)"/>
      <use href="#bulbB" transform="rotate(300)"/>
      <use href="#bulbA" transform="rotate(312)"/>
      <use href="#bulbB" transform="rotate(324)"/>
      <use href="#bulbA" transform="rotate(336)"/>
      <use href="#bulbB" transform="rotate(348)"/>
    </g>

    <ellipse cx="0" cy="420" rx="320" ry="55" fill="#040a18" opacity="0.38" filter="url(#sparkle)"/>

    <g filter="url(#coinShadow)">
      <circle r="365" fill="url(#coinFaceGrad)"/>
      <circle r="365" fill="none" stroke="url(#rimGrad)" stroke-width="24"/>
      <circle r="318" fill="none" stroke="#9adfff" stroke-opacity="0.45" stroke-width="3"/>
      <ellipse cx="-90" cy="-130" rx="190" ry="120" fill="#d6f4ff" opacity="0.16"/>
    </g>

