	c-0.5,0.5-1,1.2-1.3,1.9c-0.7,2.1-1.2,4.3-1.9,6.5l5.5,0.8l-0.4,1.5L21.9,17.6"
        fill="none" stroke="#f7fcff" stroke-width="0.28" stroke-linejoin="round" opacity="0.9"/>
    </g>

    <g font-family="'Arial Black', Arial, sans-serif" font-weight="900" text-anchor="middle" dominant-baseline="middle">
      <g transform="translate(-445 -140)">
        <circle r="64" fill="url(#ballBlue)" stroke="#d8f4ff" stroke-width="6"/>
        <text y="6" font-size="52" fill="#ffffff">8</text>
      </g>
      <g transform="translate(435 -170)">
        <circle r="58" fill="url(#ballOrange)" stroke="#fff0d7" stroke-width="6"/>
        <text y="5" font-size="48" fill="#ffffff">3</text>
      </g>
      <g transform="translate(-420 230)">
        <circle r="54" fill="url(#ballPurple)" stroke="#efe0ff" stroke-width="6"/>
        <text y="5" font-size="44" fill="#ffffff">1</text>
      </g>
      <g transform="translate(438 218)">
        <circle r="62" fill="url(#ballBlue)" stroke="#d8f4ff" stroke-width="6"/>
        <text y="5" font-size="50" fill="#ffffff">7</text>
      </g>
    </g>
  </g>
</svg>
